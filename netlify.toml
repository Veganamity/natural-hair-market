# Force non-www → www (301 permanent)
[[redirects]]
from = "https://naturalhairmarket.com/*"
to = "https://www.naturalhairmarket.com/:splat"
status = 301
force = true

# Pre-rendered listing pages for SEO bots only
# Real users get the normal SPA via the fallback below
[[redirects]]
from = "/annonce/*"
to = "https://tergjlwermtignqmsnys.supabase.co/functions/v1/listing-page/:splat"
status = 200
force = true
[redirects.conditions]
User-Agent = ["*googlebot*", "*bingbot*", "*slurp*", "*duckduckbot*", "*baiduspider*", "*yandexbot*", "*facebookexternalhit*", "*twitterbot*", "*linkedinbot*", "*whatsapp*", "*telegrambot*", "*applebot*", "*semrushbot*", "*ahrefsbot*", "*mj12bot*", "*dotbot*", "*rogerbot*", "*screaming*frog*", "*lighthouse*", "*developers.google*", "*petalbot*", "*bytespider*"]

# Dynamic sitemap from Supabase Edge Function
[[redirects]]
from = "/sitemap.xml"
to = "https://tergjlwermtignqmsnys.supabase.co/functions/v1/sitemap"
status = 200
force = true

# SPA fallback — must be last
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Security headers
[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
